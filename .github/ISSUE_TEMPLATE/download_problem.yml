name: A download does not work
description: A link fails, saves the wrong quality, or the file does not play
labels: [bug]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: The link you shared or pasted. Remove it if the video is private
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The message shown in the app and what you expected instead
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy A54, Android 15
    validations:
      required: false
